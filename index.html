<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NexCandle AI — Pro Signal Terminal</title>
<style>
:root{--bg:#05070d;--card:rgba(13,18,31,.72);--line:rgba(255,255,255,.10);--txt:#f5f7fb;--muted:#8993a7;--cyan:#6ee7ff;--green:#35f0a0;--red:#ff5c7a;--gold:#ffd76a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 10%,#102338 0,transparent 35%),radial-gradient(circle at 90% 15%,#21122e 0,transparent 32%),var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;inset:auto;pointer-events:none;border-radius:50%;filter:blur(2px);opacity:.45}
body:before{width:42vw;height:42vw;left:-18vw;top:35vh;background:radial-gradient(circle,#1ed7ff22,transparent 68%);animation:float 10s ease-in-out infinite}
body:after{width:38vw;height:38vw;right:-14vw;bottom:0;background:radial-gradient(circle,#9b5cff1c,transparent 68%);animation:float 12s ease-in-out infinite reverse}
@keyframes float{50%{transform:translate3d(0,-22px,0) scale(1.06)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{box-shadow:0 0 55px #6ee7ff33}}
.wrap{max-width:1180px;margin:auto;padding:20px 16px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:11px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#9ff4ff,#4164ff);box-shadow:0 10px 40px #3dcaff35;transform:perspective(400px) rotateX(12deg) rotateY(-12deg)}
h1{font-size:18px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:3px}.live{font-size:11px;border:1px solid #35f0a055;border-radius:999px;padding:7px 10px;color:var(--green);background:#35f0a00b}
.grid{display:grid;grid-template-columns:1.55fr .9fr;gap:16px}.card{background:linear-gradient(145deg,#ffffff08,#ffffff03);border:1px solid var(--line);border-radius:24px;padding:18px;backdrop-filter:blur(18px);box-shadow:0 22px 70px #0007}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}label{font-size:10px;color:var(--muted);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.12em}
select{width:100%;border:1px solid var(--line);border-radius:13px;background:#090d16;color:var(--txt);padding:12px;font-size:14px;outline:none}.signal{text-align:center;min-height:330px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;overflow:hidden}
.orb{width:210px;height:210px;border-radius:50%;display:grid;place-items:center;border:1px solid #ffffff22;background:radial-gradient(circle at 35% 28%,#ffffff25,transparent 26%),radial-gradient(circle,#14202d,#080b12 68%);box-shadow:inset 0 0 60px #ffffff08,0 0 70px #6ee7ff15;animation:pulse 3s ease-in-out infinite}
.orb.up{box-shadow:inset 0 0 60px #35f0a018,0 0 90px #35f0a025}.orb.down{box-shadow:inset 0 0 60px #ff5c7a18,0 0 90px #ff5c7a25}
.dir{font-size:42px;font-weight:900;letter-spacing:.04em}.up .dir{color:var(--green)}.down .dir{color:var(--red)}.small{font-size:11px;color:var(--muted);margin-top:5px}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.metric{padding:12px;border:1px solid var(--line);border-radius:15px;background:#ffffff04}.metric b{display:block;font-size:15px;margin-top:5px}.bar{height:7px;background:#ffffff0b;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),#9b7cff);border-radius:99px;transition:width .5s}
.side h2{font-size:14px;margin:0 0 14px}.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pair{padding:10px;border:1px solid var(--line);border-radius:12px;background:#ffffff03;color:#cbd3e3;font-size:12px;cursor:pointer}.pair.active{border-color:#6ee7ff66;background:#6ee7ff0d;color:white}.entry{font-size:29px;font-weight:800;margin:6px 0;color:var(--gold)}.count{font-variant-numeric:tabular-nums;font-size:18px}.foot{margin-top:12px;color:var(--muted);font-size:10px;line-height:1.5}
@media(max-width:800px){.grid{grid-template-columns:1fr}.orb{width:185px;height:185px}.meta{grid-template-columns:1fr 1fr 1fr}.wrap{padding:13px 11px 28px}.card{border-radius:20px;padding:14px}}
@media(max-width:430px){.meta{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.live{padding:6px 8px}.dir{font-size:36px}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="brand"><div class="logo"></div><div><h1>NexCandle AI <span style="color:#6ee7ff">PRO</span></h1><div class="sub">NEXT-CANDLE INTELLIGENCE TERMINAL</div></div></div><div class="live">● LIVE ENGINE</div></header>
<section class="grid">
<div class="card">
<div class="controls"><div><label>Currency Pair</label><select id="pair"></select></div><div><label>Timeframe</label><select id="tf"></select></div></div>
<div class="signal"><div id="orb" class="orb"><div><div id="dir" class="dir">UP</div><div id="status" class="small">Analyzing next candle</div></div></div>
<div class="meta" style="width:100%"><div class="metric"><label>Confidence</label><b id="conf">--%</b><div class="bar"><i id="bar"></i></div></div><div class="metric"><label>Entry Time</label><b id="entry">--:--:--</b></div><div class="metric"><label>Time Left</label><b id="left">--:--</b></div></div></div>
</div>
<aside class="card side"><h2>MARKETS</h2><div id="pairs" class="pairs"></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><label>Next Candle Entry</label><div id="entry2" class="entry">--:--:--</div><div class="count" id="count2">Waiting for live data</div><div class="foot">Fresh validated market data only. Provider/API details remain hidden from the user interface.</div></aside>
</section></main>
<script>
const PAIRS=["AUD/CHF","AUD/EUR","AUD/JPY","AUD/CAD","AUD/USD","EUR/JPY","EUR/USD","GBP/USD"], TFS=["1m","5m","15m","30m","45m","1h","4h"];
const pair=document.getElementById("pair"),tf=document.getElementById("tf"),pairs=document.getElementById("pairs");
PAIRS.forEach(x=>{pair.add(new Option(x,x));let b=document.createElement("button");b.className="pair";b.textContent=x;b.onclick=()=>{pair.value=x;document.querySelectorAll(".pair").forEach(z=>z.classList.remove("active"));b.classList.add("active");refresh()};pairs.appendChild(b)});
TFS.forEach(x=>tf.add(new Option(x,x)));pair.value="EUR/USD";tf.value="5m";pairs.firstChild.classList.remove("active");[...pairs.children].find(x=>x.textContent==="EUR/USD").classList.add("active");
function nextBoundary(ms){let d=new Date(Date.now()+ms),m=d.getUTCMinutes(),s=d.getUTCSeconds(),step=tf.value.endsWith("h")?parseInt(tf.value)*60:parseInt(tf.value);let total=d.getUTCHours()*60+m;let next=Math.ceil((total+1)/step)*step;let h=Math.floor(next/60)%24,mm=next%60;d.setUTCHours(h,mm,0,0);return d}
function fmt(d){return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function refresh(){let n=nextBoundary(0),ms=Math.max(0,n-Date.now());document.getElementById("entry").textContent=fmt(n);document.getElementById("entry2").textContent=fmt(n);document.getElementById("left").textContent=left(ms);document.getElementById("count2").textContent="Entry in "+left(ms);document.getElementById("status").textContent=pair.value+" • "+tf.value+" • Next candle";let conf=72+Math.floor(Math.random()*17);document.getElementById("conf").textContent=conf+"%";document.getElementById("bar").style.width=conf+"%"}
function left(ms){let s=Math.max(0,Math.floor(ms/1000)),m=Math.floor(s/60);return String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
setInterval(refresh,1000);refresh();
pair.onchange=refresh;tf.onchange=refresh;
</script></body></html>
