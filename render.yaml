# NexCandle AI v4.6 — fast free-data failover + next-candle engine
services:
  - type: web
    name: nexcandle-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: SIFTING_API_KEY
        sync: false
      - key: DUKASCOPY_ENABLED
        value: "true"
      - key: FINNHUB_API_KEY
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: nexcandle.db
      - key: PREMIUM_DAYS
        value: "30"
      - key: PREMIUM_PRICE
        value: ""
      - key: ALERT_INTERVAL_SECONDS
        value: "60"
      - key: MIN_SIGNAL_SCORE
        value: "72"
      - key: MARKET_CACHE_SECONDS
        value: "180"
      - key: ENTRY_CONFIRM_SECONDS
        value: "10"
      - key: ENTRY_WINDOW_SECONDS
        value: "45"
      - key: MARKET_DATA_TIMEOUT_SECONDS
        value: "8"
      - key: STALE_DATA_MULTIPLIER
        value: "2.5"
      - key: BOT_MODE
        value: "webhook"
      - key: RENDER_EXTERNAL_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: SIFTING_API_ENABLED
        value: "false"
      - key: SIFTING_WS_ENABLED
        value: "false"
      - key: SIFTING_WS_SYMBOLS
        value: "EURUSD,GBPUSD,USDJPY,AUDUSD,USDCAD"
      - key: INDIA_UPI
        sync: false
      - key: UAE_BOTIM
        sync: false

      - key: SIGNAL_CACHE_SECONDS
        value: "30"
      - key: LAST_DIRECTIONAL_MAX_AGE
        value: "900"
      - key: PROVIDER_RATE_LIMIT_COOLDOWN_SECONDS
        value: "300"
      - key: DATA_PROVIDER_ORDER
        value: "dukascopy,biquote,twelvedata,finnhub,alphavantage,yahoo2,yahoo"
      - key: ALLOW_YAHOO_FALLBACK
        value: "true"
      - key: MARKET_FETCH_LIMIT
        value: "350"
      - key: MTF_BASE_LIMIT
        value: "1200"
      - key: CACHE_TTL_1M
        value: "12"
      - key: CACHE_TTL_5M
        value: "35"
      - key: CACHE_TTL_15M
        value: "90"
      - key: CACHE_TTL_30M
        value: "150"
      - key: CACHE_TTL_45M
        value: "210"
      - key: CACHE_TTL_1H
        value: "300"
      - key: CACHE_TTL_4H
        value: "600"
      - key: ALLOW_LAST_SIGNAL_FALLBACK
        value: "false"
      - key: ALLOW_PERSISTED_SIGNAL_FALLBACK
        value: "false"
