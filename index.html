<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050812">
<title>NexCandle AI PRO — Premium Signal Terminal</title>
<style>
:root{--bg:#040711;--card:#0a1020cc;--line:#ffffff14;--text:#f5f8ff;--muted:#8290a8;--cyan:#65e8ff;--green:#2ff2a0;--red:#ff5275;--gold:#ffd86b}
*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 15% 8%,#12314d 0,transparent 30%),radial-gradient(circle at 88% 12%,#29163e 0,transparent 30%),var(--bg);min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(transparent 50%,#65e8ff04 51%);background-size:100% 6px;mix-blend-mode:screen;opacity:.25}
.wrap{max-width:1180px;margin:auto;padding:16px 14px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}.cube{width:44px;height:44px;border:1px solid #65e8ff55;border-radius:14px;background:linear-gradient(145deg,#8df4ff33,#7855ff22);box-shadow:0 0 35px #65e8ff20;transform:perspective(400px) rotateX(12deg) rotateY(-16deg)}
.title{font-weight:900;letter-spacing:.08em}.sub{font-size:9px;color:var(--muted);letter-spacing:.18em;margin-top:3px}.live{border:1px solid #2ff2a044;border-radius:99px;padding:7px 10px;color:var(--green);font-size:10px;background:#2ff2a00b}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(290px,.8fr);gap:14px}.card{border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#ffffff09,#ffffff03);box-shadow:0 24px 80px #0008;backdrop-filter:blur(18px);overflow:hidden}
.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;padding:13px;border-bottom:1px solid var(--line)}select,button{font:inherit}.select,.scan{border:1px solid var(--line);border-radius:13px;background:#080d18;color:var(--text);padding:12px;outline:none}.scan{cursor:pointer;background:linear-gradient(135deg,#65e8ff18,#7957ff18);font-weight:800;letter-spacing:.08em}
.stage{height:470px;position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle,#102034 0,#07101b 32%,#050812 70%)}
.aura{position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,#65e8ff22,transparent 68%);filter:blur(8px);animation:aura 4s ease-in-out infinite}
.core{position:relative;width:205px;height:205px;border-radius:50%;border:1px solid #65e8ff55;box-shadow:inset 0 0 50px #65e8ff10,0 0 55px #65e8ff18;display:grid;place-items:center;animation:pulse 3s ease-in-out infinite}
.core:before{content:"";position:absolute;inset:35px;border-radius:50%;border:1px solid #ffffff18;box-shadow:inset 0 0 40px #65e8ff12}.ring{position:absolute;border:1px solid #65e8ff33;border-radius:50%;inset:-25px;animation:spin 6s linear infinite}.r2{inset:-50px;animation-duration:10s;animation-direction:reverse}.r3{inset:22px;border-color:#2ff2a033;animation-duration:4s}.r4{inset:-76px;border-color:#ff527533;animation-duration:13s}
.result{z-index:4;text-align:center}.word{font-size:60px;font-weight:1000;letter-spacing:.13em;text-shadow:0 0 28px currentColor}.up{color:var(--green)}.down{color:var(--red)}.state{font-size:9px;color:var(--muted);letter-spacing:.2em;margin-top:10px}.hint{position:absolute;bottom:17px;font-size:9px;color:#718197;letter-spacing:.17em}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}.metric{border:1px solid var(--line);border-radius:15px;padding:11px;background:#ffffff04}.metric label{font-size:8px;color:var(--muted);letter-spacing:.12em;display:block}.metric b{display:block;font-size:14px;margin-top:5px}.entry{color:var(--gold)}
.side{padding:15px}.side h2{font-size:12px;letter-spacing:.16em;margin:0 0 11px}.pairs{display:grid;grid-template-columns:1fr 1fr;gap:7px}.p{border:1px solid var(--line);background:#ffffff03;color:#ccd5e5;border-radius:12px;padding:11px;text-align:left;cursor:pointer}.p.active{border-color:#65e8ff66;background:#65e8ff0b;color:#fff}.pairtf{margin-top:15px}.tf{display:flex;flex-wrap:wrap;gap:6px}.tf button{border:1px solid var(--line);background:#ffffff03;color:#aab5c7;border-radius:10px;padding:8px 10px;font-size:11px;cursor:pointer}.tf button.active{border-color:#65e8ff66;color:#fff;background:#65e8ff0c}.notice{margin-top:15px;padding:11px;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:10px;line-height:1.5}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.035);box-shadow:inset 0 0 60px #65e8ff16,0 0 90px #65e8ff25}}@keyframes aura{50%{transform:scale(1.13);opacity:.72}}
@media(max-width:820px){.grid{grid-template-columns:1fr}.stage{height:400px}.metrics{grid-template-columns:1fr 1fr}.side{order:2}}
@media(max-width:520px){.wrap{padding:10px}.controls{grid-template-columns:1fr 1fr}.scan{grid-column:1/-1}.stage{height:360px}.core{width:175px;height:175px}.word{font-size:45px}.live{font-size:9px}.pairs{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
 <div class="brand"><div class="cube"></div><div><div class="title">NEXCANDLE AI <span style="color:#65e8ff">PRO</span></div><div class="sub">NEXT-CANDLE INTELLIGENCE TERMINAL</div></div></div>
 <div class="live">● LIVE ENGINE</div>
</header>
<div class="grid">
<section class="card">
 <div class="controls">
  <select id="pair" class="select"></select>
  <select id="tf" class="select"></select>
  <button id="scan" class="scan">SCAN</button>
 </div>
 <div class="stage">
  <div class="aura"></div><div class="core"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div>
   <div id="result" class="result"><div class="word">—</div><div class="state">INITIALIZING ENGINE</div></div>
  </div>
  <div class="hint" id="hint">VALIDATED MARKET DATA • PROVIDER DETAILS HIDDEN</div>
 </div>
 <div class="metrics">
  <div class="metric"><label>DIRECTION</label><b id="dir">—</b></div>
  <div class="metric"><label>CONFIDENCE / SCORE</label><b id="score">—</b></div>
  <div class="metric"><label>ENTRY TIME</label><b class="entry" id="entry">—</b></div>
  <div class="metric"><label>COUNTDOWN</label><b id="count">—</b></div>
 </div>
</section>
<aside class="card side">
 <h2>CURRENCY PAIRS</h2><div id="pairs" class="pairs"></div>
 <div class="pairtf"><h2>TIMEFRAME</h2><div id="tfs" class="tf"></div></div>
 <div class="notice" id="notice">Fresh validated data is requested from the existing backend signal engine. API/provider names are never shown here.</div>
</aside>
</div>
</div>
<script>
const PAIRS=["AUD/CHF","AUD/EUR","AUD/JPY","AUD/CAD","AUD/USD","EUR/JPY","EUR/USD","GBP/USD"];
const TFS=["1m","5m","15m","30m","45m","1h","4h"];
const pairEl=document.getElementById("pair"),tfEl=document.getElementById("tf");
PAIRS.forEach(p=>pairEl.add(new Option(p,p)));
TFS.forEach(t=>tfEl.add(new Option(t,t)));
pairEl.value="EUR/USD";tfEl.value="5m";
const pairsBox=document.getElementById("pairs"),tfBox=document.getElementById("tfs");
PAIRS.forEach(p=>{const b=document.createElement("button");b.className="p";b.textContent=p;b.onclick=()=>{pairEl.value=p;setActive();scan()};pairsBox.appendChild(b)});
TFS.forEach(t=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>{tfEl.value=t;setActive();scan()};tfBox.appendChild(b)});
function setActive(){[...pairsBox.children].forEach(b=>b.classList.toggle("active",b.textContent===pairEl.value));[...tfBox.children].forEach(b=>b.classList.toggle("active",b.textContent===tfEl.value))}
setActive();
function pad(n){return String(n).padStart(2,"0")}
function nextCandleMs(){
 const step=({ "1m":60,"5m":300,"15m":900,"30m":1800,"45m":2700,"1h":3600,"4h":14400}[tfEl.value])*1000;
 return Math.ceil(Date.now()/step)*step;
}
function clock(ms){const d=new Date(ms);return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function countdown(ms){let s=Math.max(0,Math.ceil(ms/1000));let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;return (h?pad(h)+":":"")+pad(m)+":"+pad(s)}
function updateTime(){
 const n=nextCandleMs(), left=n-Date.now();
 document.getElementById("entry").textContent=clock(n);
 document.getElementById("count").textContent=countdown(left);
}
async function scan(){
 const result=document.getElementById("result"),hint=document.getElementById("hint");
 hint.textContent="ANALYSING • "+pairEl.value+" • "+tfEl.value;
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),12000);
 try{
  const r=await fetch("/api/premium-signal?pair="+encodeURIComponent(pairEl.value)+"&tf="+encodeURIComponent(tfEl.value),{cache:"no-store",signal:controller.signal});
  const j=await r.json();
  if(!r.ok||!j.ok||!j.signal)throw new Error("unavailable");
  const s=j.signal,d=s.display_direction;
  if(!["UP","DOWN"].includes(d))throw new Error("no-direction");
  document.getElementById("dir").textContent=d;
  document.getElementById("dir").className=d==="UP"?"up":"down";
  document.getElementById("score").textContent=(s.display_score??s.score??"—")+"%";
  result.className="result "+(d==="UP"?"up":"down");
  result.innerHTML='<div class="word">'+d+'</div><div class="state">'+(s.confirmation||"NEXT-CANDLE DIRECTION")+'</div>';
  hint.textContent=(s.fallback?"RECOVERY DATA • ":"")+"VALIDATED NEXT-CANDLE ENGINE";
  document.getElementById("notice").textContent="Market: "+pairEl.value+" • "+tfEl.value+" • Entry timing is calculated from the selected candle boundary.";
 }catch(e){
  hint.textContent="MARKET DATA UPDATING • LAST VALID STATE PRESERVED";
 }finally{clearTimeout(timeout)}
}
document.getElementById("scan").onclick=scan;pairEl.onchange=()=>{setActive();scan()};tfEl.onchange=()=>{setActive();scan()};
setInterval(updateTime,1000);setInterval(scan,30000);updateTime();scan();
</script>
</body>
</html>
