services:
  - type: web
    name: nexcandle-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: nexcandle.db
      - key: PREMIUM_DAYS
        value: "30"
      - key: PREMIUM_PRICE
        value: ""
      - key: ALERT_INTERVAL_SECONDS
        value: "60"
      - key: MIN_SIGNAL_SCORE
        value: "72"
      - key: MARKET_CACHE_SECONDS
        value: "45"
      - key: ENTRY_CONFIRM_SECONDS
        value: "10"
      - key: ENTRY_WINDOW_SECONDS
        value: "45"
      - key: MARKET_DATA_TIMEOUT_SECONDS
        value: "20"
      - key: STALE_DATA_MULTIPLIER
        value: "2.5"
      - key: INDIA_UPI
        sync: false
      - key: UAE_BOTIM
        sync: false
