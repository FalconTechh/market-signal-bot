services:
  - type: web
    name: nexcandle-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: DATABASE_PATH
        value: nexcandle.db
      - key: PREMIUM_DAYS
        value: "30"
      - key: ALERT_INTERVAL_SECONDS
        value: "60"
      - key: INDIA_UPI
        value: "6361472511"
      - key: UAE_BOTIM
        value: "0522445121"
